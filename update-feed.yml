name: Update Prom stock file (daily)

on:
  workflow_dispatch: {}
  # Daily automatic run. See README.md ("About the exact run time") for
  # the note about daylight saving time.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build-stock-file:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the updated stock/availability file
        run: >
          python build_prom_import.py
          --base base_export.xlsx
          --mode stock
          --output docs/prom_stock.xlsx

      - name: Commit the updated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/prom_stock.xlsx
          git diff --staged --quiet || git commit -m "Auto-update stock $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
