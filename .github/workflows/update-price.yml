name: Update Prom price feed (manual)

# Тільки ручний запуск — кнопка "Run workflow" на вкладці Actions.
# Розкладу (schedule) навмисно немає: ціну оновлюємо не щодня, а лише
# коли це справді потрібно.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-price-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозиторію
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Сформувати файл ціни
        run: python merge_feeds.py --mode price --price-output docs/price_feed.xml

      - name: Закомітити оновлений файл
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/price_feed.xml
          git diff --staged --quiet || git commit -m "Ручне оновлення ціни $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
