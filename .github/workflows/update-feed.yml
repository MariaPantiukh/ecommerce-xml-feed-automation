name: Update Prom stock feed (daily)

on:
  # Manual run via the "Run workflow" button on the Actions tab (handy for testing)
  workflow_dispatch: {}
  # Daily automatic run.
  # NOTE: GitHub Actions schedules run in UTC and don't account for
  # daylight saving time. 03:00 UTC is roughly 06:00 Kyiv time in summer
  # (EEST, UTC+3) and roughly 05:00 in winter (EET, UTC+2). If you need
  # minute-perfect accuracy year-round, see README.md ("About the exact
  # run time").
  schedule:
    - cron: "0 3 * * *"

# Lets the workflow commit changes back to the repository itself
permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the stock/availability file (no price)
        run: python merge_feeds.py --mode stock --output docs/merged_feed.xml

      - name: Commit the updated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/merged_feed.xml
          git diff --staged --quiet || git commit -m "Auto-update stock $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
