name: Update Prom price file (manual)

# Manual run only — the "Run workflow" button on the Actions tab.
# There's no schedule on purpose: prices aren't updated every day, only
# when it's actually needed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-price-file:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the updated price file
        run: >
          python build_prom_import.py
          --base base_export.xlsx
          --mode price
          --output docs/prom_price.xlsx

      - name: Commit the updated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/prom_price.xlsx
          git diff --staged --quiet || git commit -m "Manual price update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
